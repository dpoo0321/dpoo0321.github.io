<!DOCTYPE html>
<html>
    <head>
        <title>Website Portafolio</title>
        <link rel="stylesheet" href="design.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <script src="https://kit.fontawesome.com/2e5e4b836f.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header>
            <nav id="navegacion">
                <div class="logo">David<span>M</span></div>
                <ul class="navegacion-enlaces">
                    <li><a href="#intro">Intro</a></li>
                    <li><a href="#projects">Projects</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="intro" class="hero">
                <div class="hero-content">
                    <div class="hero-text"> 
                        <h1>David M</h1>
                        <h2>Junior developer</h2>
                        <p>I'm a student that is apassionated about of new technology hardware and software. The main languages that I use for programming are Python, CSS, HTML and GDscript</p>
                        <div class="socialmedias">
                            <a href="https://github.com/dpoo0321" target="_blank"><i class="fab fa-github"></i></a>
                        </div>
                        
                    </div>
                    <div class="images">
                        <img src="images/profile.png" alt="profile-image">
                    </div>
                </div>
            </section>
            <section id="projects" class="projects">
                <h2 class="projects-title">Personal Projects</h2>
                <div class="carousel-container">
                    <button class="nav-arrow left">
                        <img src="images/nxt_icon.png" height="40px" width="40px"/>
                    </button>
                    <div class="carousel-track">
                        <div class="card" data-index="0">
                            <img src="images/personal_wordmark.png" alt="Wordmark">
                        </div>
                        <div class="card" data-index="1">
                            <img src="images/stencil_portrait.png" alt="stencil-portrait">
                        </div>
                        <div class="card" data-index="2">
                            <img src="images/Tesellation.png" alt="Tesellation">
                        </div>
                        <div class="card" data-index="3">
                            <img src="images/Design_project.png" alt="Design-project">
                        </div>
                        <div class="card" data-index="4">
                            <img src="images/Tangram.png" alt="Tangram">
                        </div>
                    </div>
                    <button class="nav-arrow right">
                        <img src="images/nxt_icon.png" height="40px" width="40px"/>
                    </button>
                </div>
                <div class="projects-info">
                    <h2 class="project-name">Personal Wordmark</h2>
                </div>

                <div class="dots">
                    <div class="dot active" data-index="0"></div>
                    <div class="dot" data-index="1"></div>
                    <div class="dot" data-index="2"></div>
                    <div class="dot" data-index="3"></div>
                    <div class="dot" data-index="4"></div>
                </div>
            </section>
        </main>
        <footer>
            <div class="footer-content">
                <p>2026 David M - Copyright</p>
                <div class="social medias">
                     <a href="https://github.com/dpoo0321" target="_blank"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </footer>
    <script src="js/custom.js"></script>
    </body>
</html>
